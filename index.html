<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Code Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: url('https://images.unsplash.com/photo-1545239351-1141bd82e8a6?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.85);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      background-color: #fff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      text-align: center;
      margin: 5vh auto;
    }

    h1 {
      margin-bottom: 1rem;
      color: #333;
      font-size: 1.8rem;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      transition: border 0.3s;
    }

    input:focus {
      border-color: #4a90e2;
    }

    #qrcode {
      margin-top: 2rem;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>QR Code Generator</h1>
    <input id="urlInput" type="text" placeholder="Enter URL and press Enter" />
    <div id="qrcode"></div>
    <footer>Made with Lê Thanh Hoàng ❤️</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <script>
    const input = document.getElementById('urlInput');
    const qrDiv = document.getElementById('qrcode');
    let qr;

    input.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        qrDiv.innerHTML = '';
        if (input.value.trim() === '') return;
        qr = new QRCode(qrDiv, {
          text: input.value,
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff",
        });
      }
    });
  </script>
</body>
</html>
